# Sends the evening "daily goal" push to your phone. Set up from Stint: ⋯ → Reminders when Stint is closed.
# Does nothing until the STINT_PUSH secret exists.
name: Daily goal reminder

on:
  schedule:
    - cron: "7,37 * * * *" # every 30 minutes (UTC). Keep in step with SLOT_MINUTES in remind.js
  workflow_dispatch: # the "Run workflow" button sends a test notification straight away

permissions:
  contents: read

concurrency:
  group: reminder

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STINT_PUSH: ${{ secrets.STINT_PUSH }}
      TEST: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Is it reminder time?
        id: check
        run: node .github/scripts/remind.js check

      - name: Install web-push
        if: steps.check.outputs.send == 'true'
        run: npm install --no-save --no-package-lock --no-audit --no-fund web-push@3.6.7

      - name: Send
        if: steps.check.outputs.send == 'true'
        run: node .github/scripts/remind.js send
